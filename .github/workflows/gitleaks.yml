name: gitleaks

# Reusable secret scan. Callers copy examples/caller.yml and pin this file by commit sha.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    # GitHub-hosted on purpose: it runs on pull requests from forks, so it never shares a runner with secrets.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      RULES_SHA256: 3044e7cfca14d090312f9e942c34f379ba12ca4b79ba3e966f89bbbf3085c6a5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # No step runs a file from the checkout: it holds the pull request's code.
      - name: Install gitleaks
        id: install
        run: |
          dir="$(mktemp -d)"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$dir/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $dir/$tarball" | sha256sum -c -
          tar -xzf "$dir/$tarball" -C "$dir" gitleaks
          echo "bin=$dir/gitleaks" >> "$GITHUB_OUTPUT"

      - name: The rules file is the shared one
        run: |
          if [ ! -f .gitleaks.toml ]; then
            echo "::error file=.gitleaks.toml::missing; copy gitleaks.toml from Positronic-Robotics/secret-scanning at the pinned commit"
            exit 1
          fi
          actual="$(sha256sum .gitleaks.toml | cut -d' ' -f1)"
          if [ "$actual" != "$RULES_SHA256" ]; then
            echo "::error file=.gitleaks.toml::differs from the shared rules (sha256 $actual, expected $RULES_SHA256). Copy gitleaks.toml from Positronic-Robotics/secret-scanning at the commit this workflow is pinned to."
            exit 1
          fi

      - name: Resolve the commits to scan
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request|pull_request_target) base="$PR_BASE"; head="$PR_HEAD" ;;
            push) base="$PUSH_BEFORE"; head="$PUSH_AFTER" ;;
            *) echo "::error::gitleaks scans pull_request and push events only, not $EVENT"; exit 1 ;;
          esac
          if ! git cat-file -e "${head}^{commit}" 2>/dev/null; then
            echo "::error::head commit $head is not in the checkout"
            exit 1
          fi
          # A first push or a force push has no base to scan from. Scanning less would hide commits, so stop.
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "::error::cannot resolve the base commit '$base' of this $EVENT, so the added commits are unknown. Scan by hand: gitleaks git --redact --log-opts='--diff-merges=remerge <last scanned commit>..$head'"
            exit 1
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: List waivers this change adds
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
        run: |
          # BEGIN scripts/list_waivers.sh
          #!/usr/bin/env bash
          # Print, as notices, every gitleaks:allow line and .gitleaksignore entry that BASE...HEAD_SHA adds.
          # File and line only: a line marked gitleaks:allow may hold a fake value, so it is never printed.
          # The workflow embeds this file verbatim (scripts/sync_workflow.py); run it from the repository root.
          set -euo pipefail
          : "${BASE:?}" "${HEAD_SHA:?}"
          git diff --no-ext-diff --no-textconv -U0 "$BASE...$HEAD_SHA" | awk '
            /^\+\+\+ / { file = ($2 ~ /^b\//) ? substr($2, 3) : ""; next }
            /^@@/ { split($3, a, ","); line = substr(a[1], 2) - 1; next }
            /^\+/ { line++; if (file != "" && $0 ~ /gitleaks:allow/) printf "::notice file=%s,line=%d::adds a gitleaks:allow waiver\n", file, line }
          '
          git diff --no-ext-diff --no-textconv -U0 "$BASE...$HEAD_SHA" -- .gitleaksignore | awk '
            /^@@/ { split($3, a, ","); line = substr(a[1], 2) - 1; next }
            /^\+\+\+ / { next }
            /^\+/ { line++; entry = substr($0, 2); if (entry !~ /^[[:space:]]*(#|$)/) printf "::notice file=.gitleaksignore,line=%d::adds ignore entry %s\n", line, entry }
          '
          # END scripts/list_waivers.sh

      - name: Scan the added commits
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
          GITLEAKS_BIN: ${{ steps.install.outputs.bin }}
        run: |
          # BEGIN scripts/scan.sh
          #!/usr/bin/env bash
          # Scan the commits BASE..HEAD_SHA with the hash-checked .gitleaks.toml, using the gitleaks at GITLEAKS_BIN.
          # The workflow embeds this file verbatim (scripts/sync_workflow.py); run it from the repository root.
          set -euo pipefail
          : "${BASE:?}" "${HEAD_SHA:?}" "${GITLEAKS_BIN:?}"
          # remerge reports a conflict resolution's file as b/<path>, so each waiver is also written in that form.
          ignore="$(mktemp -d)/.gitleaksignore"
          touch "$ignore"
          if [ -f .gitleaksignore ]; then
            grep -v -E '^[[:space:]]*(#|$)' .gitleaksignore | while IFS= read -r entry; do
              printf '%s\n' "$entry"
              if [[ "$entry" =~ ^([0-9a-f]{40}):(.*)$ ]]; then
                printf '%s:b/%s\n' "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}"
              else
                printf 'b/%s\n' "$entry"
              fi
            done > "$ignore"
          fi
          # The config and ignore paths are explicit, so no environment variable can replace them.
          env -u GITLEAKS_CONFIG -u GITLEAKS_CONFIG_TOML "$GITLEAKS_BIN" git \
            --config "$PWD/.gitleaks.toml" --gitleaks-ignore-path "$ignore" \
            --log-opts="--diff-merges=remerge $BASE..$HEAD_SHA" --redact --no-banner --verbose .
          # END scripts/scan.sh
