name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, so a change in the runner's git or in GitHub's environment shows up without a rules change.
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of the gitleaks release file. Public, not a secret. scripts/sync_workflow.py copies this and
      # GITLEAKS_VERSION from gitleaks.yml, which says how to check or update them.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      # Commit id of the actions/checkout v7.0.1 tag, pinned so a moved tag cannot change what runs. Public, not a secret.
      # To check it: git ls-remote https://github.com/actions/checkout refs/tags/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Canary test
        run: python3 -I canary_test.py gitleaks.toml
      - name: Waiver listing
        run: python3 -I test_list_waivers.py
      - name: Workflows and README carry the current rules hash, scripts and version pin
        run: python3 -I scripts/sync_workflow.py --check
      - name: actionlint
        run: pipx run --spec actionlint-py==1.7.12.24 actionlint
