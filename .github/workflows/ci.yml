name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, so a change in the runner's git or in GitHub's environment shows up without a rules change.
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of the gitleaks release file. Public, not a secret. scripts/sync_workflow.py copies this and
      # GITLEAKS_VERSION from gitleaks.yml, which says how to check or update them.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      ACTIONLINT_VERSION: 1.7.12
      # sha256 of the actionlint release file. Public, not a secret. To check or update it:
      # curl -sSfL https://github.com/rhysd/actionlint/releases/download/v<VERSION>/actionlint_<VERSION>_checksums.txt | grep linux_amd64
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      # Commit id of the actions/checkout v7.0.1 tag, pinned so a moved tag cannot change what runs. Public, not a secret.
      # To check it: git ls-remote https://github.com/actions/checkout refs/tags/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same cache and install script as gitleaks.yml. Commit id of the actions/cache v5.1.0 tag. Public, not a secret.
      - id: gitleaks-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/gitleaks-download
          key: gitleaks-${{ env.GITLEAKS_VERSION }}-${{ env.GITLEAKS_SHA256 }}
      - name: Install gitleaks
        id: gitleaks
        env:
          TOOL: gitleaks
          TOOL_URL: https://github.com/gitleaks/gitleaks/releases/download/v${{ env.GITLEAKS_VERSION }}/gitleaks_${{ env.GITLEAKS_VERSION }}_linux_x64.tar.gz
          TOOL_SHA256: ${{ env.GITLEAKS_SHA256 }}
          DOWNLOAD_DIR: ${{ runner.temp }}/gitleaks-download
        run: |
          # BEGIN scripts/install_pinned_tool.sh
          #!/usr/bin/env bash
          # Extract the binary TOOL from the release tarball at TOOL_URL into a new directory, and write its path as bin to GITHUB_OUTPUT.
          # The tarball comes from DOWNLOAD_DIR when the Actions cache put it there with the sha256 TOOL_SHA256, else from TOOL_URL.
          # The workflows embed this file verbatim (scripts/sync_workflow.py).
          set -euo pipefail
          : "${TOOL:?}" "${TOOL_URL:?}" "${TOOL_SHA256:?}" "${DOWNLOAD_DIR:?}" "${GITHUB_OUTPUT:?}"
          tarball="$DOWNLOAD_DIR/${TOOL_URL##*/}"
          if [ -f "$tarball" ] && echo "$TOOL_SHA256  $tarball" | sha256sum --check --status --strict; then
            echo "$TOOL: the Actions cache holds ${tarball##*/}, so nothing is downloaded."
          else
            echo "$TOOL: the Actions cache does not hold ${tarball##*/}. Download $TOOL_URL."
            rm -rf "$DOWNLOAD_DIR"
            mkdir -p "$DOWNLOAD_DIR"
            # The retries span 3 minutes: an outage of the download server can last minutes.
            curl -sSfL --retry 12 --retry-delay 15 --retry-max-time 180 --retry-all-errors -o "$tarball" "$TOOL_URL"
            echo "$TOOL_SHA256  $tarball" | sha256sum --check --strict
          fi
          dir="$(mktemp -d)"
          tar -xzf "$tarball" -C "$dir" "$TOOL"
          echo "bin=$dir/$TOOL" >> "$GITHUB_OUTPUT"
          # END scripts/install_pinned_tool.sh
      - if: steps.gitleaks-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/gitleaks-download
          key: gitleaks-${{ env.GITLEAKS_VERSION }}-${{ env.GITLEAKS_SHA256 }}
      - name: Put gitleaks on the PATH
        env:
          GITLEAKS_BIN: ${{ steps.gitleaks.outputs.bin }}
        run: dirname "$GITLEAKS_BIN" >> "$GITHUB_PATH"
      - name: Canary test
        run: python3 -I canary_test.py gitleaks.toml
      - name: Waiver listing
        run: python3 -I test_list_waivers.py
      - name: Install script
        run: python3 -I test_install_pinned_tool.py
      - name: Workflows and README carry the current rules hash, scripts and version pin
        run: python3 -I scripts/sync_workflow.py --check
      - id: actionlint-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/actionlint-download
          key: actionlint-${{ env.ACTIONLINT_VERSION }}-${{ env.ACTIONLINT_SHA256 }}
      - name: Install actionlint
        id: actionlint
        env:
          TOOL: actionlint
          TOOL_URL: https://github.com/rhysd/actionlint/releases/download/v${{ env.ACTIONLINT_VERSION }}/actionlint_${{ env.ACTIONLINT_VERSION }}_linux_amd64.tar.gz
          TOOL_SHA256: ${{ env.ACTIONLINT_SHA256 }}
          DOWNLOAD_DIR: ${{ runner.temp }}/actionlint-download
        run: |
          # BEGIN scripts/install_pinned_tool.sh
          #!/usr/bin/env bash
          # Extract the binary TOOL from the release tarball at TOOL_URL into a new directory, and write its path as bin to GITHUB_OUTPUT.
          # The tarball comes from DOWNLOAD_DIR when the Actions cache put it there with the sha256 TOOL_SHA256, else from TOOL_URL.
          # The workflows embed this file verbatim (scripts/sync_workflow.py).
          set -euo pipefail
          : "${TOOL:?}" "${TOOL_URL:?}" "${TOOL_SHA256:?}" "${DOWNLOAD_DIR:?}" "${GITHUB_OUTPUT:?}"
          tarball="$DOWNLOAD_DIR/${TOOL_URL##*/}"
          if [ -f "$tarball" ] && echo "$TOOL_SHA256  $tarball" | sha256sum --check --status --strict; then
            echo "$TOOL: the Actions cache holds ${tarball##*/}, so nothing is downloaded."
          else
            echo "$TOOL: the Actions cache does not hold ${tarball##*/}. Download $TOOL_URL."
            rm -rf "$DOWNLOAD_DIR"
            mkdir -p "$DOWNLOAD_DIR"
            # The retries span 3 minutes: an outage of the download server can last minutes.
            curl -sSfL --retry 12 --retry-delay 15 --retry-max-time 180 --retry-all-errors -o "$tarball" "$TOOL_URL"
            echo "$TOOL_SHA256  $tarball" | sha256sum --check --strict
          fi
          dir="$(mktemp -d)"
          tar -xzf "$tarball" -C "$dir" "$TOOL"
          echo "bin=$dir/$TOOL" >> "$GITHUB_OUTPUT"
          # END scripts/install_pinned_tool.sh
      - if: steps.actionlint-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/actionlint-download
          key: actionlint-${{ env.ACTIONLINT_VERSION }}-${{ env.ACTIONLINT_SHA256 }}
      - name: actionlint
        env:
          ACTIONLINT_BIN: ${{ steps.actionlint.outputs.bin }}
        run: '"$ACTIONLINT_BIN"'
